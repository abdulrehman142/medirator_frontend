[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_BASE_URL = "/api/v1"
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "https://medirator-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200