[build]
  # No build step required — publishing prebuilt `dist` dropped into repo root
  command = "echo 'Using prebuilt dist; no build required'"
  publish = "dist"

[build.environment]
  VITE_API_BASE_URL = "https://medirator-backend.onrender.com/api/v1"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
